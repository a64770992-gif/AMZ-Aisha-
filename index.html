<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AMZ Collection - Original</title>
<style>
body{margin:0;font-family:sans-serif;background:#fff5f5}
.header{background:#fff;padding:15px;text-align:center;box-shadow:0 2px 10px #ccc;position:sticky;top:0;font-weight:700;color:#7a2a2a;font-size:22px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.card{background:#fff;border-radius:15px;overflow:hidden;box-shadow:0 4px 12px #ddd}
.card img{width:100%;height:180px;object-fit:cover}
.info{padding:10px}
.price{color:#7a2a2a;font-weight:700}
.btn{width:100%;padding:10px;background:#25D366;color:#fff;border:none;border-radius:10px;font-weight:700;margin-top:8px}
</style>
</head>
<body>
<div class="header">AMZ ORIGINAL - 03142605729</div>
<div id="grid" class="grid"></div>
<script>
const PHONE="923142605729";
const PRODUCTS=[
{name:"AMZ Black Royal Abaya",price:5500,img:"https://images.unsplash.com/photo-1594633312681-425c7b97ccd1?w=600"},
{name:"AMZ Brown Premium Abaya",price:5200,img:"https://images.unsplash.com/photo-1610030469983-98e550d6193c?w=600"},
{name:"AMZ Nida Abaya",price:5800,img:"https://images.unsplash.com/photo-1584302054198-7f3a7c0c3a5f?w=600"},
{name:"AMZ Embroidered Abaya",price:6000,img:"https://images.unsplash.com/photo-1594633312681-425c7b97ccd1?w=600"}
];
document.getElementById('grid').innerHTML=PRODUCTS.map(p=>`
<div class="card">
<img src="${p.img}">
<div class="info">
<h3 style="font-size:13px">${p.name}</h3>
<p class="price">Rs.${p.price}</p>
<button class="btn" onclick="window.open('https://wa.me/${PHONE}?text=AMZ Order ${p.name}','_blank')">WhatsApp - 03142605729</button>
</div>
</div>`).join('');
</script>
</body>
</html>
